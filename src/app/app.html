<mat-sidenav-container>
  <mat-sidenav #sidenav>
    <app-menu></app-menu>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      <button mat-button (click)="onToggleSidenav(sidenav)" class="menu-toggle-button">
        <mat-icon class="menubar">menu</mat-icon>
      </button>
      <div class="name-div"><a class="name" routerLink="/home">Basic Car Rental</a></div>
      <nav>
        <ul class="navbar">
          <li><a class="navbar-element" routerLink="/home">Home</a></li>
          <li><a class="navbar-element" routerLink="/search">Search Cars</a></li>
        </ul>
      </nav>
    </mat-toolbar>
    <div class="router-outlet-container">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
